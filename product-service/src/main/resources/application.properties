server.port=${SERVER_PORT:8081}
spring.application.name=product-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fertilizer_products}
spring.datasource.username=${DB_USER:fertilizer}
spring.datasource.password=${DB_PASSWORD:fertilizer_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Pool sizes must be load-tested and sized against PostgreSQL max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
