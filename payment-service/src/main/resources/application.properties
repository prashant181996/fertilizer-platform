server.port=${SERVER_PORT:8084}
spring.application.name=payment-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fertilizer_payments}
spring.datasource.username=${DB_USER:fertilizer}
spring.datasource.password=${DB_PASSWORD:fertilizer_dev_password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.connection-timeout=2000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:12}
