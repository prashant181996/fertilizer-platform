services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fertilizer
      POSTGRES_USER: fertilizer
      POSTGRES_PASSWORD: fertilizer_dev_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fertilizer -d fertilizer"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: bitnami/kafka:3.8
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  product-service:
    build: {context: ., dockerfile: product-service/Dockerfile}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fertilizer
      DB_USER: fertilizer
      DB_PASSWORD: fertilizer_dev_password
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8081:8081"]
  inventory-service:
    build: {context: ., dockerfile: inventory-service/Dockerfile}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fertilizer
      DB_USER: fertilizer
      DB_PASSWORD: fertilizer_dev_password
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8082:8082"]
  payment-service:
    build: {context: ., dockerfile: payment-service/Dockerfile}
    ports: ["8084:8084"]
  delivery-service:
    build: {context: ., dockerfile: delivery-service/Dockerfile}
    ports: ["8085:8085"]
  notification-service:
    build: {context: ., dockerfile: notification-service/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["8086:8086"]
  order-service:
    build: {context: ., dockerfile: order-service/Dockerfile}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fertilizer
      DB_USER: fertilizer
      DB_PASSWORD: fertilizer_dev_password
      PRODUCT_URL: http://product-service:8081
      INVENTORY_URL: http://inventory-service:8082
      PAYMENT_URL: http://payment-service:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
      product-service: {condition: service_started}
      inventory-service: {condition: service_started}
      payment-service: {condition: service_started}
      kafka: {condition: service_healthy}
    ports: ["8083:8083"]
  api-gateway:
    build: {context: ., dockerfile: api-gateway/Dockerfile}
    environment:
      REDIS_HOST: redis
      PRODUCT_URL: http://product-service:8081
      INVENTORY_URL: http://inventory-service:8082
      ORDER_URL: http://order-service:8083
      PAYMENT_URL: http://payment-service:8084
      DELIVERY_URL: http://delivery-service:8085
    depends_on:
      redis: {condition: service_healthy}
      product-service: {condition: service_started}
      inventory-service: {condition: service_started}
      order-service: {condition: service_started}
      payment-service: {condition: service_started}
      delivery-service: {condition: service_started}
    ports: ["8080:8080"]
volumes:
  pgdata:
