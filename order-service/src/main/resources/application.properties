server.port=${SERVER_PORT:8083}
spring.application.name=order-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fertilizer}
spring.datasource.username=${DB_USER:fertilizer}
spring.datasource.password=${DB_PASSWORD:fertilizer_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
services.product-url=${PRODUCT_URL:http://localhost:8081}
services.inventory-url=${INVENTORY_URL:http://localhost:8082}
services.payment-url=${PAYMENT_URL:http://localhost:8084}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.delivery.timeout.ms=10000
