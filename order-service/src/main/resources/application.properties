server.port=${SERVER_PORT:8083}
spring.application.name=order-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/h2/orders;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false
services.product-url=${PRODUCT_URL:http://localhost:8081}
services.inventory-url=${INVENTORY_URL:http://localhost:8082}
services.payment-url=${PAYMENT_URL:http://localhost:8084}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.delivery.timeout.ms=10000

# H2 is for local development and functional tests; pool sizes are not a 10k TPS guarantee.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.batch-size=65536
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.compression-type=lz4
