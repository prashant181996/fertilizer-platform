server.port=${SERVER_PORT:8085}
spring.application.name=delivery-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# H2 file database configured for future persistent entities; demo endpoints may still use in-memory state.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/h2/deliveries;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
